name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # 真实 PostgreSQL 验证 DATABASE_URL 切换路径（create_all / seed / 全部接口测试）
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growth"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/growth
      LLM_API_KEY: ""
      EMBED_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Seed demo data into PostgreSQL
        run: python seed.py
      - name: Test (pytest, against PostgreSQL)
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        # React 19 peer 冲突与本地一致，legacy-peer-deps 安装
        run: npm ci --legacy-peer-deps
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest + RTL)
        run: npm run test
      - name: Build (tsc + vite)
        run: npm run build
